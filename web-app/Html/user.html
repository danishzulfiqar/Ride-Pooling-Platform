<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/user.css">
    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>

    <!-- TODO: Add SDKs for Firebase products that you want to use
        https://firebase.google.com/docs/web/setup#available-libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="../Js/Firebase.js"></script>
    <script src="../Js/user.js"></script>
    <script src="https://kit.fontawesome.com/461ad1934b.js" crossorigin="anonymous"></script>
    <title>RidePool App</title>
</head>

<body>
    <!-- <button onclick="signout()">Logout</button> -->

    <nav id="navbar">
        <section class="logo">
            <a href="#">RidePool</a>
        </section>
        <input type="checkbox" id="click">
        <label for="click" class="menu-btn">
            <i class="fas fa-bars"></i>
        </label>
        <ul>
            <li><a class="active-page" href="Admin.html">HOME</a></li>
            <li><a href="#">MORE</a></li>
            <li>
                <span id="User-drop"> <span id="User-Name">USERS</span><i id="user-nav-down" class="fa-solid fa-caret-down drop-down-icons"></i>
                    <ul id="User-dropdown">
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-rectangle-list subIcon"></i> My Trips</a>
                        </li>
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-wallet subIcon"></i> Wallet</a></li>
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-gear subIcon"></i> Settings</a></li>
                        <li class="subMenu"><a onclick="signout()"><i
                                    class="fa-solid fa-right-from-bracket subIcon"></i> Logout</a></li>
                    </ul>
                </span>
            </li>
        </ul>
    </nav>

    <section id="Map-Section">
        <div id="map"></div>
    </section>

    <section id="Main-Controls-Area">
        <div class="control-header">
            <span>Where can we pick you up?</span>
        </div>
        <div id="Input-Section">
            <div class="PlaceInputs">
                <i class="fa-solid fa-location-dot SearchIcon"></i>
                <input onkeyup="ClearPickUpValue()" class="PlaceSearch" id="SearchPickUp" placeholder="Add a Pickup Location" type="text">
                <i id="clearPick" class="fa-solid fa-circle-xmark"></i>
            </div>
            <div class="PlaceInputs">
                <i class="fa-solid fa-circle-dot SearchIcon"></i>
                <input onkeyup="ClearDropOffValue()" class="PlaceSearch" id="SearchDropOff" placeholder="Add a Drop Off Location" type="text">
                <i id="clearDrop" class="fa-solid fa-circle-xmark"></i>
            </div>
        </div>
    </section>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API_KEY&libraries=places&callback=initMap"
        async defer></script>
</body>

</html>
