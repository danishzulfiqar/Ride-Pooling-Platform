<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/user.css">
    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>

    <!-- TODO: Add SDKs for Firebase products that you want to use
        https://firebase.google.com/docs/web/setup#available-libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="../Js/Firebase.js"></script>
    <script src="../Js/usersettings.js"></script>
    <script src="https://kit.fontawesome.com/461ad1934b.js" crossorigin="anonymous"></script>
    <title>RidePool App</title>
</head>

<body>

    <nav id="navbar">
        <section class="logo">
            <a href="#"><i class="fa-solid fa-car"></i>RidePool</a>
        </section>
        <input type="checkbox" id="click">
        <label for="click" class="menu-btn">
            <i class="fas fa-bars"></i>
        </label>
        <ul>
            <li><a href="user.html">HOME</a></li>
            <li><a href="#">MORE</a></li>
            <li>
                <span id="User-drop"> <span id="User-Name">USERS</span><i id="user-nav-down"
                        class="fa-solid fa-caret-down drop-down-icons"></i>
                    <ul id="User-dropdown">
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-rectangle-list subIcon"></i> My Trips</a>
                        </li>
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-wallet subIcon"></i> Wallet</a></li>
                        <li class="subMenu"><a href="#"><i class="fa-solid fa-gear subIcon"></i> Settings</a></li>
                        <li class="subMenu"><a onclick="signout()"><i
                                    class="fa-solid fa-right-from-bracket subIcon"></i> Logout</a></li>
                    </ul>
                </span>
            </li>
        </ul>
    </nav>

    <section class="settings-main-container">
        <div class="left-nav">
            <ul>
                <li> <a href="user.html"> Book Now </a></li>
                <li> <a href="#"> My Trips </a></li>
                <li> <a href="#"> Wallet </a></li>
                <li class="active-left-nav-page"> <a href="#"> Settings </a></li>
            </ul>
        </div>
        <div class="settings-right-container">
            <div class="user-details">

                <div class="user-details-components">
                    <div><img src="../Assets/User.jpeg" alt="Error Loading"></div>
                    <div class="user-details-name-div">
                        <span id="Settings-Name"></span>
                        <span id="Settings-Phone"></span>
                    </div>
                </div>

                <div class="user-details-components-column">
                    <label>Location</label>
                    <span class="user-details-components-column-data">Pakistan</span>
                </div>

                <div class="user-details-components-column">
                    <label>Email</label>
                    <span class="user-details-components-column-data" id="Settings-Email">danishzulfiqar@gmail.com</span>
                </div>

                <div class="user-details-components-bottom">
                    
                </div>

                <div class="user-details-components-column">
                    <button>Privacy Policy</button>
                    <span class="Settings-Msg">Click to view privacy policy</span>
                    <button onclick="signout()" id="Settings-Logout">Logout</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
