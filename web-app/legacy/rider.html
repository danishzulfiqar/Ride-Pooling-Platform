<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/461ad1934b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="ridestyle.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API_KEY&libraries=places&callback=initMap"
        async defer></script>
    <script src="index.js"></script>
    <script src="style.js"></script>
    <title>Trippya</title>
</head>

<body>

    <div id="navbar">
        <div id="Site-name">
            <div id="nav-toggle" class="hamburger" onclick="navChange()">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <a href="#">Prototype</a>
        </div>

        <div class="right-nav">
            <a class="login" href="#"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</a>
            <a class="signup" href="#"><i class="fa-regular fa-user"></i> Signup</a>
        </div>
    </div>

    <div id="help">
        <a href="#"><i class="fa-solid fa-comment-dots"></i></a>
    </div>

    <section id="main-container">

        <div id="controls">

            <div id="seat-selection">
                <label><i class="fa-solid fa-users"></i></label>
                <select id="seats">
                    <option value="1">1 Seat</option>
                    <option value="2">2 Seats</option>
                    <option value="3">3 Seats</option>
                    <option value="4">4 Seats</option>
                </select>
            </div>

            <div>
                <label for="From"><i class="fa-solid fa-location-crosshairs"></i></label>
                <input id="from" type="text" placeholder="Origin">
            </div>

            <div>
                <label for="From"><i class="fa-solid fa-map-location-dot"></i></label>
                <input id="to" type="text" placeholder="Destination">
            </div>

            <button id="submit"><i class="fa-solid fa-route"></i> Lets Go</button>

            <div id="output"><span> Distance</span>
                <p id="outputNum"></p> <span>Km</span>
            </div>

            <div id="share">
                <a class="whatsapp" href="#"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="#"><i class="fa-brands fa-facebook-messenger messenger"></i></a>
                <a class="link" href="#"><i class="fa-solid fa-paperclip"></i></a>
            </div>

        </div>

        <div id="map"></div>
    </section>

    <script>
        var searchInput1 = 'from';
        var searchInput2 = 'to';

        $(document).ready(function () {
            var autocomplete1;
            autocomplete1 = new google.maps.places.Autocomplete((document.getElementById(searchInput1)), {
                types: ['geocode'],
            });
            autocomplete2 = new google.maps.places.Autocomplete((document.getElementById(searchInput2)), {
                types: ['geocode'],
            });

            google.maps.event.addListener(autocomplete1, 'place_changed', function () {
                var near_place = autocomplete1.getPlace();
            });
        });
    </script>

</body>

</html>
