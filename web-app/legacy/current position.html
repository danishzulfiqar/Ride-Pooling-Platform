<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Set the height of the map to 100% of the window */
        #map {
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- The map will be displayed in this div -->
    <div id="map"></div>

    <script>
        // This example requires the Geolocation API to be enabled in your browser
        // You can find instructions on how to do this at:
        // https://developers.google.com/maps/documentation/javascript/geolocation

        // Initialize the map
        var map;
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -34.397, lng: 150.644 },
                zoom: 6
            });

            // Try to get the user's current position
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    var pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Center the map on the user's current position
                    map.setCenter(pos);

                    // Add a marker to the map to indicate the user's current position
                    var marker = new google.maps.Marker({
                        position: pos,
                        map: map,
                        title: 'Current position'
                    });
                }, function () {
                    // If the user denies access to their location, display an error message
                    handleLocationError(true, infoWindow, map.getCenter());
                });
            } else {
                // If the browser doesn't support geolocation, display an error message
                handleLocationError(false, infoWindow, map.getCenter());
            }
        }

        // Handle any errors that occur when trying to get the user's current position
        function handleLocationError(browserHasGeolocation, infoWindow, pos) {
            infoWindow.setPosition(pos);
            infoWindow.setContent(browserHasGeolocation ?
                'Error: The Geolocation service failed.' :
                'Error: Your browser doesn\'t support geolocation.');
            infoWindow.open(map);
        }
    </script>
    <!-- Load the Google Maps JavaScript API -->
    <!-- <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API_KEY&callback=initMap">
</script> -->
</body>

</html>
