<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-label="Ride-pooling platform architecture" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#536171"/></marker></defs><rect width="1180" height="520" rx="14" fill="#ffffff"/><text x="28" y="38" font-size="12" font-weight="700" letter-spacing="1.6" fill="#305b8a">RIDE-POOLING PLATFORM ARCHITECTURE</text><rect x="20" y="56" width="280" height="444" rx="12" fill="#f3f6f9" stroke="#c9d3de" stroke-dasharray="4 4"/><text x="36" y="80" font-size="11" font-weight="700" letter-spacing="1.3" fill="#b47b40" text-anchor="start">CLIENTS</text><rect x="38" y="96" width="244" height="118" rx="10" fill="#ffffff" stroke="#b47b40" stroke-width="1.4"/><rect x="38" y="96" width="244" height="6" rx="3" fill="#b47b40"/><text x="52" y="124" font-size="14.5" font-weight="700" fill="#202c3a">Passenger app</text><text x="52" y="144" font-size="12" fill="#536171">React Native · Expo</text><text x="52" y="161" font-size="12" fill="#536171">GO · Pooling · Sharing modes</text><text x="52" y="178" font-size="12" fill="#536171">Redux + redux-persist</text><rect x="38" y="236" width="244" height="118" rx="10" fill="#ffffff" stroke="#b47b40" stroke-width="1.4"/><rect x="38" y="236" width="244" height="6" rx="3" fill="#b47b40"/><text x="52" y="264" font-size="14.5" font-weight="700" fill="#202c3a">Driver app</text><text x="52" y="284" font-size="12" fill="#536171">same codebase, rider role</text><text x="52" y="301" font-size="12" fill="#536171">live location every 1 s</text><text x="52" y="318" font-size="12" fill="#536171">accept · pick up · drop off</text><rect x="38" y="376" width="244" height="104" rx="10" fill="#ffffff" stroke="#202c3a" stroke-width="1.4"/><rect x="38" y="376" width="244" height="6" rx="3" fill="#202c3a"/><